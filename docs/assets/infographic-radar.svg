<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <linearGradient id="radarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="polyCurrent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="polyBaseline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.25" />
    </linearGradient>

    <pattern id="radarGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <rect width="800" height="460" fill="url(#radarBg)" rx="12" />
  <rect width="800" height="460" fill="url(#radarGrid)" rx="12" />
  <rect x="1" y="1" width="798" height="458" rx="12" fill="none" stroke="#334155" stroke-width="1.2" />

  <!-- Header -->
  <g transform="translate(35, 35)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#10B981" letter-spacing="1.2">DIAGNOSTIC TELEMETRY RADAR</text>
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">Multi-Axis Field Health vs. ICAR Baseline</text>
  </g>

  <!-- RADAR CHART (Center at x=250, y=245, radius=130) -->
  <g transform="translate(250, 245)">
    <!-- Concentric Pentagons (20%, 40%, 60%, 80%, 100%) -->
    <!-- R = 130, angles = -90, -18, 54, 126, 198 deg -->
    <!-- 20% (R=26) -->
    <polygon points="0,-26 24.7,-8 15.3,21 -15.3,21 -24.7,-8" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2,2" />
    <!-- 40% (R=52) -->
    <polygon points="0,-52 49.5,-16 30.6,42.1 -30.6,42.1 -49.5,-16" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2,2" />
    <!-- 60% (R=78) -->
    <polygon points="0,-78 74.2,-24.1 45.8,63.1 -45.8,63.1 -74.2,-24.1" fill="none" stroke="#334155" stroke-width="1" />
    <!-- 80% (R=104) -->
    <polygon points="0,-104 98.9,-32.1 61.1,84.1 -61.1,84.1 -98.9,-32.1" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2,2" />
    <!-- 100% (R=130) -->
    <polygon points="0,-130 123.6,-40.2 76.4,105.2 -76.4,105.2 -123.6,-40.2" fill="none" stroke="#475569" stroke-width="1.5" />

    <!-- Radial Axis Spokes -->
    <line x1="0" y1="0" x2="0" y2="-130" stroke="#475569" stroke-width="1" />
    <line x1="0" y1="0" x2="123.6" y2="-40.2" stroke="#475569" stroke-width="1" />
    <line x1="0" y1="0" x2="76.4" y2="105.2" stroke="#475569" stroke-width="1" />
    <line x1="0" y1="0" x2="-76.4" y2="105.2" stroke="#475569" stroke-width="1" />
    <line x1="0" y1="0" x2="-123.6" y2="-40.2" stroke="#475569" stroke-width="1" />

    <!-- Safe ICAR Baseline Polygon (Normalized: [0.75, 0.8, 0.6, 0.8, 0.25]) -->
    <!-- Point 1 (Top, Soil pH): R = 130 * 0.75 = 97.5 -> (0, -97.5) -->
    <!-- Point 2 (Right Top, Nitrogen): R = 130 * 0.8 = 104 -> (98.9, -32.1) -->
    <!-- Point 3 (Right Bottom, Humidity): R = 130 * 0.6 = 78 -> (45.8, 63.1) -->
    <!-- Point 4 (Left Bottom, Sentinel NDVI): R = 130 * 0.8 = 104 -> (-61.1, 84.1) -->
    <!-- Point 5 (Left Top, Pathogen Threat): R = 130 * 0.25 = 32.5 -> (-30.9, -10.0) -->
    <polygon points="0,-97.5 98.9,-32.1 45.8,63.1 -61.1,84.1 -30.9,-10.0" fill="url(#polyBaseline)" stroke="#10B981" stroke-width="2" />
    
    <!-- Current Field Condition Polygon (Normalized: [0.55, 0.45, 0.95, 0.65, 0.85]) -->
    <!-- Point 1: R = 130 * 0.55 = 71.5 -> (0, -71.5) -->
    <!-- Point 2: R = 130 * 0.45 = 58.5 -> (55.6, -18.1) -->
    <!-- Point 3: R = 130 * 0.95 = 123.5 -> (72.6, 99.9) -->
    <!-- Point 4: R = 130 * 0.65 = 84.5 -> (-49.7, 68.4) -->
    <!-- Point 5: R = 130 * 0.85 = 110.5 -> (-105.1, -34.1) -->
    <polygon points="0,-71.5 55.6,-18.1 72.6,99.9 -49.7,68.4 -105.1,-34.1" fill="url(#polyCurrent)" stroke="#F59E0B" stroke-width="2.5" />

    <!-- Current Vertices Dots -->
    <circle cx="0" cy="-71.5" r="4.5" fill="#F59E0B" />
    <circle cx="55.6" cy="-18.1" r="4.5" fill="#F59E0B" />
    <circle cx="72.6" cy="99.9" r="4.5" fill="#EF4444" />
    <circle cx="-49.7" cy="68.4" r="4.5" fill="#F59E0B" />
    <circle cx="-105.1" cy="-34.1" r="4.5" fill="#EF4444" />

    <!-- Axis Labels -->
    <text x="0" y="-142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#F8FAFC">Soil pH (6.2)</text>
    <text x="135" y="-36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#F8FAFC">Nitrogen (185 kg/ha)</text>
    <text x="85" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#EF4444">Humidity (84% ⚠️)</text>
    <text x="-85" y="122" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#38BDF8">Sentinel NDVI (0.64)</text>
    <text x="-135" y="-36" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#EF4444">Pathogen Risk (High ⚠️)</text>
  </g>

  <!-- RIGHT CARD: DIAGNOSTIC AUDIT BREAKDOWN -->
  <g transform="translate(480, 75)">
    <rect width="285" height="345" rx="10" fill="#0B1329" stroke="#1E293B" stroke-width="1" />
    <rect x="16" y="16" width="253" height="30" rx="6" fill="#1E293B" />
    <text x="26" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="0.5">TELEMETRY DEVIATION ANALYSIS</text>

    <!-- Row 1 -->
    <g transform="translate(18, 65)">
      <circle cx="6" cy="6" r="4" fill="#EF4444" />
      <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">Microclimate Humidity Spike</text>
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">Current: 84% · Safe: &lt;65% (+19% excess)</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(18, 115)">
      <circle cx="6" cy="6" r="4" fill="#F59E0B" />
      <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">Soil Nitrogen Deficit</text>
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">Current: 185 kg/ha · Optimal: 280 kg/ha</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(18, 165)">
      <circle cx="6" cy="6" r="4" fill="#10B981" />
      <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">Canopy Photosynthetic Vigor</text>
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">Sentinel-2 NDVI: 0.64 (Satisfactory)</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(18, 215)">
      <circle cx="6" cy="6" r="4" fill="#EF4444" />
      <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">Active Pathogen Pressure</text>
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">Nilaparvata lugens localized infestation</text>
    </g>

    <!-- Legend Box -->
    <g transform="translate(18, 280)">
      <rect width="250" height="45" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
      <circle cx="16" cy="22" r="4.5" fill="#F59E0B" />
      <text x="26" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#F1F5F9">Current Telemetry</text>

      <circle cx="136" cy="22" r="4.5" fill="#10B981" />
      <text x="146" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#F1F5F9">Safe ICAR Baseline</text>
    </g>
  </g>
</svg>
