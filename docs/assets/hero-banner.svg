<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <!-- Background Linear & Radial Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#051B14" />
    </linearGradient>

    <radialGradient id="emeraldGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="saffronGlow" cx="20%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F0FDF4" />
      <stop offset="80%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.5" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glowBadge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10B981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />
  <rect width="1200" height="480" fill="url(#grid)" />
  <rect width="1200" height="480" fill="url(#emeraldGlow)" />
  <rect width="1200" height="480" fill="url(#saffronGlow)" />

  <!-- Outer Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="477" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Sovereign Public Good Badge -->
  <g transform="translate(410, 48)">
    <rect x="0" y="0" width="380" height="34" rx="17" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <!-- Tricolor Dots -->
    <circle cx="20" cy="17" r="4.5" fill="#FF9933" />
    <circle cx="34" cy="17" r="4.5" fill="#FFFFFF" />
    <circle cx="48" cy="17" r="4.5" fill="#138808" />
    <text x="64" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" letter-spacing="1.5">DIGITAL PUBLIC GOOD · IN.GOV.DPG.FARMCONTEXT.V1</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="52" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1.5">
      KrishiSetu <tspan font-size="36" font-weight="600" fill="#A7F3D0" dx="8">(कृषि-सेतु)</tspan>
    </text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" letter-spacing="-0.2">
      Interoperable Agronomic Intelligence Network &amp; Outbreak Defense Gateway
    </text>
  </g>

  <!-- 4 Capability Glassmorphic Cards -->
  <g transform="translate(70, 230)">
    <!-- Card 1: Multimodal Vision -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="250" height="110" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#065F46" fill-opacity="0.4" stroke="#10B981" stroke-width="1" />
      <text x="34" y="40" text-anchor="middle" font-size="18">🔬</text>
      <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#F1F5F9">Multimodal Vision</text>
      <text x="62" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#10B981">Gemini 2.5 Flash Engine</text>
      <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">Automated lesion detection &amp; calibrated confidence scoring.</text>
    </g>

    <!-- Card 2: Sentinel-2 Satellite -->
    <g transform="translate(270, 0)" filter="url(#shadow)">
      <rect width="250" height="110" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#1E3A8A" fill-opacity="0.4" stroke="#3B82F6" stroke-width="1" />
      <text x="34" y="40" text-anchor="middle" font-size="18">🛰️</text>
      <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#F1F5F9">Sentinel-2 Telemetry</text>
      <text x="62" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#60A5FA">L2A Spectral Provenance</text>
      <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">B8 NIR / B4 Red reflectance with verified NDVI metrics.</text>
    </g>

    <!-- Card 3: ICAR Vector RAG -->
    <g transform="translate(540, 0)" filter="url(#shadow)">
      <rect width="250" height="110" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#78350F" fill-opacity="0.4" stroke="#F59E0B" stroke-width="1" />
      <text x="34" y="40" text-anchor="middle" font-size="18">🌾</text>
      <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#F1F5F9">ICAR-CRRI RAG</text>
      <text x="62" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#FBBF24">Clinical Agronomy Core</text>
      <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">Grounded 4-stage treatment &amp; soil health regeneration.</text>
    </g>

    <!-- Card 4: Federated Outbreak Defense -->
    <g transform="translate(810, 0)" filter="url(#shadow)">
      <rect width="250" height="110" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#831843" fill-opacity="0.4" stroke="#F43F5E" stroke-width="1" />
      <text x="34" y="40" text-anchor="middle" font-size="18">🛡️</text>
      <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#F1F5F9">Corridor Defense</text>
      <text x="62" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#FB7185">Federated Outbreaks</text>
      <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94A3B8">Cross-border transmission alerts (WB ↔ Bihar corridors).</text>
    </g>
  </g>

  <!-- Bottom Metric / Status Ribbon -->
  <g transform="translate(70, 395)">
    <rect width="1060" height="48" rx="10" fill="#0B1329" fill-opacity="0.7" stroke="#1E293B" stroke-width="1" />
    
    <!-- Item 1 -->
    <circle cx="45" cy="24" r="4" fill="#10B981" />
    <text x="60" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">4 State Registries</text>
    <text x="180" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748B">WB · Bihar · Odisha · Punjab</text>

    <!-- Divider -->
    <line x1="375" y1="12" x2="375" y2="36" stroke="#334155" stroke-width="1" />

    <!-- Item 2 -->
    <circle cx="405" cy="24" r="4" fill="#3B82F6" />
    <text x="420" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Zero Vendor Lock-in</text>
    <text x="560" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748B">Open DPG Standard</text>

    <!-- Divider -->
    <line x1="710" y1="12" x2="710" y2="36" stroke="#334155" stroke-width="1" />

    <!-- Item 3 -->
    <circle cx="740" cy="24" r="4" fill="#F59E0B" />
    <text x="755" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Vernacular Inclusion</text>
    <text x="895" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748B">Hindi &amp; Bengali Voice (gTTS)</text>
  </g>
</svg>
