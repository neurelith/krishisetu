<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <linearGradient id="roadmapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <pattern id="roadGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <rect width="1000" height="360" fill="url(#roadmapBg)" rx="12" />
  <rect width="1000" height="360" fill="url(#roadGrid)" rx="12" />
  <rect x="1" y="1" width="998" height="358" rx="12" fill="none" stroke="#334155" stroke-width="1.2" />

  <!-- Header -->
  <g transform="translate(40, 35)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#10B981" letter-spacing="1.2">CHRONOLOGICAL CLINICAL PROTOCOL</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">4-Stage ICAR Regenerative Treatment Roadmap</text>
  </g>

  <!-- Connecting Timeline Axis -->
  <line x1="80" y1="130" x2="920" y2="130" stroke="#334155" stroke-width="3" />
  <line x1="80" y1="130" x2="350" y2="130" stroke="#10B981" stroke-width="3.5" />

  <!-- STAGE 1: 0 - 48 Hours -->
  <g transform="translate(60, 110)">
    <circle cx="20" cy="20" r="16" fill="#065F46" stroke="#10B981" stroke-width="2.5" />
    <text x="20" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#F1F5F9">1</text>
    <rect x="-10" y="48" width="200" height="150" rx="10" fill="#0B1329" stroke="#10B981" stroke-width="1.2" />
    <text x="6" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#10B981">STAGE 1 · 0-48 HOURS</text>
    <text x="6" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Containment</text>
    <text x="6" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• Drain excess standing water</text>
    <text x="6" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• Open alleys every 2 meters</text>
    <text x="6" y="154" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• Cease synthetic Nitrogen</text>
    <rect x="6" y="166" width="168" height="20" rx="4" fill="#064E3B" />
    <text x="90" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#6EE7B7">Active Field Action</text>
  </g>

  <!-- STAGE 2: 3 - 7 Days -->
  <g transform="translate(290, 110)">
    <circle cx="20" cy="20" r="16" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2" />
    <text x="20" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#F1F5F9">2</text>
    <rect x="-10" y="48" width="200" height="150" rx="10" fill="#0B1329" stroke="#334155" stroke-width="1" />
    <text x="6" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#60A5FA">STAGE 2 · 3-7 DAYS</text>
    <text x="6" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Curative Treatment</text>
    <text x="6" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• Target root-zone foliage</text>
    <text x="6" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• Triflumezopyrim 10% SC</text>
    <text x="6" y="154" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• Calibrated dosage: 94ml/acre</text>
    <rect x="6" y="166" width="168" height="20" rx="4" fill="#1E293B" />
    <text x="90" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Prescribed Intervention</text>
  </g>

  <!-- STAGE 3: 8 - 14 Days -->
  <g transform="translate(520, 110)">
