    <rect x="-10" y="48" width="200" height="150" rx="10" fill="#0B1329" stroke="#334155" stroke-width="1" />
    <text x="6" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#FBBF24">STAGE 3 · 8-14 DAYS</text>
    <text x="6" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Soil Remediation</text>
    <text x="6" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• Apply Potash (MOP) top-dress</text>
    <text x="6" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• Strengthen culm silica wall</text>
    <text x="6" y="154" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• Bio-fertilizer foliar spray</text>
    <rect x="6" y="166" width="168" height="20" rx="4" fill="#1E293B" />
    <text x="90" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Biochemical Balance</text>
  </g>

  <!-- STAGE 4: 15 - 28 Days -->
  <g transform="translate(750, 110)">
    <circle cx="20" cy="20" r="16" fill="#881337" stroke="#F43F5E" stroke-width="2" />
    <text x="20" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#F1F5F9">4</text>
    <rect x="-10" y="48" width="200" height="150" rx="10" fill="#0B1329" stroke="#334155" stroke-width="1" />
    <text x="6" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#FB7185">STAGE 4 · 15-28 DAYS</text>
    <text x="6" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Harvest Recovery</text>
    <text x="6" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• Verify Sentinel-2 NDVI rebound</text>
    <text x="6" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• Protect panicle grain fill</text>
    <text x="6" y="154" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• Prevent secondary lodging</text>
    <rect x="6" y="166" width="168" height="20" rx="4" fill="#1E293B" />
    <text x="90" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Yield Preservation</text>
  </g>
</svg>
