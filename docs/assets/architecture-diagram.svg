    <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#38BDF8">Farmer Diagnostic &amp; Audio Hub</text>
    <text x="18" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• Vernacular Audio: Hindi &amp; Bengali</text>
    <text x="18" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• SVG 4-Stage Treatment Roadmap</text>
    <text x="18" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• Offline-first PWA with Field Sync</text>
