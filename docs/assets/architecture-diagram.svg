  <path d="M 490 240 C 520 240, 520 140, 550 140" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow)" filter="url(#glowLine)" />
  <path d="M 490 300 C 520 300, 520 300, 550 300" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow)" filter="url(#glowLine)" />
  <path d="M 490 360 C 520 360, 520 460, 550 460" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow)" filter="url(#glowLine)" />

  <!-- Col 3 to Col 4 -->
  <path d="M 780 140 C 810 140, 810 140, 850 140" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)" />
  <path d="M 780 300 C 810 300, 810 300, 850 300" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)" />
  <path d="M 780 460 C 810 460, 810 460, 850 460" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)" />

