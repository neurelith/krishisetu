    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#F1F5F9">🌉 Kisan Setu (किसान सेतु)</text>
    <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#C084FC">Federated Interop Console</text>
    <text x="18" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• Live JSON Inspector &amp; Diff Tool</text>
    <text x="18" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• Dynamic Declarative Rule Builder</text>
    <text x="18" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">• State Payload Field Lineage Audit</text>
