    <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#FECDD3">Spectral Provenance Engine</text>
    <text x="18" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#E2E8F0">• Real NDVI = (B8 - B4)/(B8 + B4)</text>
    <text x="18" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#E2E8F0">• Tile Granule verification</text>
    <text x="18" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#E2E8F0">• Crop canopy vigor monitoring</text>
