    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#64748B" letter-spacing="1.2">3. MULTIMODAL REASONING</text>
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Grounded AI Engines</text>
  </g>

