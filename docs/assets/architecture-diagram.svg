    <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F1F5F9">DBT Agriculture</text>
    <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#3B82F6">Govt. of Bihar</text>
    <text x="14" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748B">kisan_nam, zila, fasal</text>
