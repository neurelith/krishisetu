    <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#FDE68A">Clinical Grounding Knowledge</text>
    <text x="18" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#E2E8F0">• 4-Stage ICAR treatment roadmaps</text>
    <text x="18" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#E2E8F0">• Soil health regeneration (pH/NPK)</text>
    <text x="18" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#E2E8F0">• Deterministic evidence reasoning</text>
