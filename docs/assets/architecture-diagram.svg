  <path d="M 230 220 C 260 220, 260 285, 290 285" fill="none" stroke="#059669" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrow)" />
  <path d="M 230 325 C 260 325, 260 300, 290 300" fill="none" stroke="#059669" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrow)" />
  <path d="M 230 430 C 260 430, 260 315, 290 315" fill="none" stroke="#059669" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrow)" />

