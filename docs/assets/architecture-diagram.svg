    <circle cx="310" cy="17" r="4" fill="#F59E0B" />
    <text x="322" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">ICAR Clinical Verification</text>
    <circle cx="490" cy="17" r="4" fill="#F43F5E" />
