<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#061A14" />
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="nodeEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="nodeAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#451A03" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="nodeRose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#881337" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4C0519" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Lines -->
    <linearGradient id="flowEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="glowLine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#10B981" flood-opacity="0.6" />
    </filter>

    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="600" fill="url(#archBg)" rx="12" />
  <rect width="1200" height="600" fill="url(#archGrid)" rx="12" />
  <rect x="1" y="1" width="1198" height="598" rx="12" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Section Headers / Columns -->
  <!-- Col 1: State Silos -->
  <g transform="translate(40, 30)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#64748B" letter-spacing="1.2">1. HETEROGENEOUS INGESTION</text>
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">State Registries</text>
  </g>

  <!-- Col 2: Interop Standard -->
  <g transform="translate(300, 30)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#64748B" letter-spacing="1.2">2. DPG NORMALIZATION</text>
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">in.gov.dpg Standard</text>
  </g>

  <!-- Col 3: Intelligence Core -->
